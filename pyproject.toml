[project]
name = "govee-local-api"
version = "3.3.2"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Galorhallen", email = "andrea.ponte1987@gmail.com" }]
description = "Library to communicate with Govee local API"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
"Repository" = "https://github.com/Galorhallen/govee-local-api"
"Bug Tracker" = "https://github.com/Galorhallen/govee-local-api/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "prompt_toolkit>=3.0.0,<4",
    "pre-commit>=4.6.2,<5",
]

[tool.ruff.isort]
force-sort-within-sections = true
known-first-party = [
    "govee_local_api",
]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "-v",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.14"]
build-backend = "uv_build"
